[package]
name = "iterminal"
version = "2.3.2"
description = "SSH Connection Manager"
authors = ["iTerminal"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.50", default-features = true }
russh-sftp = "2.0"
anyhow = "1"
once_cell = "1"
chrono = "0.4"
font-kit = "0.14"
# HTTP API Server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "2"
rand = "0.8"
urlencoding = "2.1"

# 数据库和加密
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
lazy_static = "1.4"
shellexpand = "3.1"
# License 签名（Free stub 不使用，Pro 构建注入 license.rs 后使用）
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
hostname = "0.4"
# AI 助手：调用 OpenAI 兼容的 /v1/chat/completions（rustls 避免 macOS OpenSSL 链接问题）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Pro 构建：由 build-pro.sh 注入 license.rs 后启用。
# 用途：让代码能用 #[cfg(feature = "pro")] 区分 Free / Pro 构建行为。
# 注意：license.rs 本身是文件覆盖式注入，不依赖此 flag；
#       此 flag 用于未来 Pro 专属逻辑（如 AI 服务的密钥注入开关）。
pro = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
